<script>
const blob = JSON.parse(document.getElementById('encrypted-data').textContent);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tryDecrypt(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(blob.salt), iterations:100000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(blob.iv)}, key, b64(blob.data));
  return new TextDecoder().decode(pt);
}
async function unlock(pw, remember){
  document.getElementById('prompt').style.display='none';
  document.getElementById('spin').style.display='block';
  try{
    const html = await tryDecrypt(pw);
    if(remember) sessionStorage.setItem('wuk_pw', pw);
    document.open(); document.write(html); document.close();
  }catch(e){
    document.getElementById('spin').style.display='none';
    document.getElementById('prompt').style.display='block';
    document.getElementById('err').textContent='Wrong password';
    sessionStorage.removeItem('wuk_pw');
  }
}
function go(){ unlock(document.getElementById('pw').value, true); }
document.getElementById('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
const saved = sessionStorage.getItem('wuk_pw');
if(saved) unlock(saved, false);
</script>
